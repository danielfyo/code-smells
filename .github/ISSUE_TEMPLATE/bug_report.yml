name: Bug report
description: Something in the code or the docs is wrong.
title: "fix: "
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Documentation / explanation, Python, C# (.NET), React + TypeScript, Go, Angular, Catalog / tools, CI / tooling]
    validations:
      required: true
  - type: input
    id: smell
    attributes:
      label: Smell
      description: Catalog ID or slug, if the problem is about a specific smell (for example CS042 or feature-envy).
  - type: textarea
    id: description
    attributes:
      label: What is wrong?
      description: Include file paths, the command you ran and its output if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
